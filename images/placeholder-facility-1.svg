<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="Facility photo placeholder">
  <rect width="400" height="280" fill="#e8eff7"/>
  <!-- building body -->
  <rect x="110" y="110" width="180" height="120" fill="#1a5e8a" opacity="0.25"/>
  <!-- roof line -->
  <polygon points="100,110 200,65 300,110" fill="#1a5e8a" opacity="0.35"/>
  <!-- door -->
  <rect x="175" y="178" width="50" height="52" rx="4" fill="#1a5e8a" opacity="0.5"/>
  <!-- windows row 1 -->
  <rect x="127" y="128" width="30" height="28" rx="3" fill="#1a5e8a" opacity="0.45"/>
  <rect x="185" y="128" width="30" height="28" rx="3" fill="#1a5e8a" opacity="0.45"/>
  <rect x="243" y="128" width="30" height="28" rx="3" fill="#1a5e8a" opacity="0.45"/>
  <!-- label -->
  <text x="200" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#555" text-anchor="middle" font-weight="600">Facility Photo</text>
</svg>
