<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="Facility photo placeholder">
  <rect width="400" height="280" fill="#f4f0f8"/>
  <!-- building body -->
  <rect x="105" y="112" width="190" height="118" fill="#5a3d8a" opacity="0.20"/>
  <!-- roof line -->
  <polygon points="95,112 200,68 305,112" fill="#5a3d8a" opacity="0.28"/>
  <!-- door -->
  <rect x="176" y="180" width="48" height="50" rx="4" fill="#5a3d8a" opacity="0.42"/>
  <!-- windows row 1 -->
  <rect x="122" y="130" width="30" height="27" rx="3" fill="#5a3d8a" opacity="0.38"/>
  <rect x="185" y="130" width="30" height="27" rx="3" fill="#5a3d8a" opacity="0.38"/>
  <rect x="248" y="130" width="30" height="27" rx="3" fill="#5a3d8a" opacity="0.38"/>
  <!-- path walkway -->
  <rect x="191" y="230" width="18" height="30" fill="#5a3d8a" opacity="0.18"/>
  <!-- label -->
  <text x="200" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#555" text-anchor="middle" font-weight="600">Facility Photo</text>
</svg>
