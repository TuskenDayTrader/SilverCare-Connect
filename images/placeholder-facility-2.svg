<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="Facility photo placeholder">
  <rect width="400" height="280" fill="#edf3f0"/>
  <!-- building body -->
  <rect x="100" y="108" width="200" height="122" fill="#1a7a55" opacity="0.22"/>
  <!-- roof line -->
  <polygon points="90,108 200,62 310,108" fill="#1a7a55" opacity="0.30"/>
  <!-- door -->
  <rect x="177" y="178" width="46" height="52" rx="4" fill="#1a7a55" opacity="0.45"/>
  <!-- windows row 1 -->
  <rect x="120" y="128" width="32" height="28" rx="3" fill="#1a7a55" opacity="0.40"/>
  <rect x="184" y="128" width="32" height="28" rx="3" fill="#1a7a55" opacity="0.40"/>
  <rect x="248" y="128" width="32" height="28" rx="3" fill="#1a7a55" opacity="0.40"/>
  <!-- trees -->
  <circle cx="80" cy="185" r="22" fill="#1a7a55" opacity="0.18"/>
  <circle cx="320" cy="190" r="18" fill="#1a7a55" opacity="0.18"/>
  <!-- label -->
  <text x="200" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#555" text-anchor="middle" font-weight="600">Facility Photo</text>
</svg>
